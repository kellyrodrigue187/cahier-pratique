<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon cahier">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon cahier de pratique — 3e année</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --paper:#FFFFFF;--line:#CFE0F6;--margin:#E8505B;--ink:#1D2B4F;--soft:#5A6A8C;
  --math:#2C6BE0;--fr:#D6336C;--star:#F2A100;--ok:#13915D;--bad:#D33A3A;--tile:#F2F7FE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131C33;--line:#22325A;--margin:#B8434D;--ink:#E9EEFB;--soft:#9AA8C7;
  --math:#78A6FF;--fr:#FF7EAB;--star:#FFC23D;--ok:#3CCB8E;--bad:#FF6B6B;--tile:#1A2544;}}
:root[data-theme="dark"]{
  --paper:#131C33;--line:#22325A;--margin:#B8434D;--ink:#E9EEFB;--soft:#9AA8C7;
  --math:#78A6FF;--fr:#FF7EAB;--star:#FFC23D;--ok:#3CCB8E;--bad:#FF6B6B;--tile:#1A2544;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:'Andika',ui-rounded,'Segoe UI',system-ui,sans-serif;font-size:19px;line-height:1.5;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);
}
body::before{content:"";position:fixed;top:0;bottom:0;left:30px;width:2px;background:var(--margin);opacity:.7;pointer-events:none}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 48px 52px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.brand{font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;font-weight:800;font-size:1.35rem;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;text-align:left;line-height:1.1}
.hdr-r{display:flex;align-items:center;gap:10px}
.snd{background:var(--tile);border:2px solid var(--line);border-radius:999px;font-size:1.1rem;line-height:1;padding:7px 10px;cursor:pointer;color:var(--ink)}
.stars{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.25rem;color:var(--star);white-space:nowrap}
.gold{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.15rem;white-space:nowrap;cursor:pointer;
  background:#FFF4CC;color:#8A5A00;border:2px solid #F2C14E;border-radius:999px;padding:3px 11px}
.hdr-r{gap:8px!important}
/* Boutique */
.shopbtn{display:flex;align-items:center;gap:14px;width:100%;margin-top:28px;padding:14px 16px;border-radius:18px;cursor:pointer;
  font:inherit;text-align:left;background:linear-gradient(135deg,#FFE3F1,#FFF4CC);color:#5B2A4A;border:3px solid #F7A8CF}
.shopbtn b{font-family:'Baloo 2',system-ui,sans-serif;font-size:1.35rem;display:block;line-height:1.1}
.shopbtn svg{width:64px;height:64px;flex:none}
.wallet{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.4rem;color:#B07800;margin:0 0 6px}
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sq.giant{grid-column:1/-1}
.sq.giant svg{max-width:260px}
.sq.giant b{font-size:1.3rem}
.sq{background:var(--tile);border-radius:18px;padding:10px 10px 12px;text-align:center;border:3px solid transparent}
.sq.own{border-color:#F7A8CF}
.sq svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto}
.sq b{display:block;font-size:1.05rem;line-height:1.2;margin:4px 0 8px}
.buy{font:inherit;font-weight:700;font-size:1rem;width:100%;border:0;border-radius:12px;padding:8px 6px;cursor:pointer;background:#F2C14E;color:#4A3000}
.buy.sure{background:#13915D;color:#fff}
.buy:disabled{background:var(--line);color:var(--soft);cursor:default}
.mine{font-weight:700;color:#C2337A}
.coll{display:flex;flex-wrap:wrap;gap:6px;min-height:20px}
.coll svg{width:88px;height:88px}
.mbox{display:flex;flex-direction:column;align-items:center;background:#1E1B2E;border:3px dashed #8F7BFF;border-radius:16px;padding:6px 6px 4px;cursor:pointer;color:#fff;font:inherit;font-size:.72rem}
.mbox svg,.sq.myst svg{filter:brightness(0)}
.sq.myst{background:#1E1B2E;color:#fff}
.mreveal svg{width:min(260px,70vw);height:auto;filter:brightness(0);animation:wobble 1.2s ease-in-out infinite}
.mreveal.go svg{animation:pop2 .9s ease-out forwards}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.03)}}
@keyframes pop2{0%{filter:brightness(0);transform:scale(1)}40%{filter:brightness(0);transform:scale(1.15) rotate(8deg)}60%{filter:brightness(3);transform:scale(.9)}100%{filter:brightness(1);transform:scale(1.1)}}
.empty{color:var(--soft);font-size:.95rem;margin:0}
.dashbtn{margin-top:12px;background:linear-gradient(135deg,#E5DBFF,#DDF3FF);color:#2E1F5E;border-color:#B7A3F5}
.dashbtn svg{width:64px;height:54px}
.poop{position:absolute;top:-70px;line-height:1;animation:fall var(--dur) ease-in var(--del) forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(115vh) rotate(var(--rot))}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 4px}
.stats div{background:var(--tile);border-radius:16px;padding:12px 14px;color:var(--soft);font-size:.95rem;line-height:1.2}
.stats span{display:block;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.8rem;color:var(--ink);line-height:1.1}
h3.sub{font-size:1.05rem;margin:16px 0 8px;color:var(--soft)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.ch{background:var(--tile);border-radius:16px;padding:10px 8px;text-align:center}
.ch svg{width:76px;height:auto;display:block;margin:0 auto 4px}
.ch b{display:block;font-size:.9rem;line-height:1.2}
.ch small{display:block;font-size:.78rem;color:var(--soft);line-height:1.3}
.ch.locked b{color:var(--soft)}
.coll.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.coll.big figure{margin:0;text-align:center;background:var(--tile);border-radius:14px;padding:6px 4px}
.coll.big svg{width:72px;height:72px}
.coll.big figcaption{font-size:.78rem;line-height:1.2;color:var(--ink)}
.coll.big .locked svg{filter:grayscale(1) brightness(.35);opacity:.35}
.coll.big .locked figcaption{color:var(--soft)}
.sq.rare{border:3px solid transparent;background:linear-gradient(var(--tile),var(--tile)) padding-box,var(--rg) border-box}
.r-or{--rg:linear-gradient(135deg,#FFE36E,#E0A400,#FFF3B0)}
.r-argent{--rg:linear-gradient(135deg,#FFFFFF,#9AA6B8,#E6EBF2)}
.r-glitter{--rg:linear-gradient(135deg,#FF8AD8,#B28CFF,#7FD8FF,#FFE36E)}
.r-galaxie{--rg:linear-gradient(135deg,#A98BFF,#2B1B6B,#7FD8FF)}
.need{display:block;font-size:.78rem;color:var(--soft);margin-top:4px}
.cal{background:var(--tile);border-radius:18px;padding:12px}
.calhead{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.25rem;text-transform:capitalize;margin-bottom:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calgrid>b{text-align:center;font-size:.8rem;color:var(--soft)}
.cd{position:relative;aspect-ratio:1/1.15;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);border:2px solid var(--line);font:inherit;color:var(--ink);padding:0;overflow:hidden}
.cd i{position:absolute;top:2px;left:5px;font-style:normal;font-size:.7rem;color:var(--soft)}
.cd.empty{background:none;border:0}
.cd.lock span{font-size:1.1rem;opacity:.35}
.cd.miss{opacity:.45}
.cd.done{border-color:#F2C14E;background:#FFF8DD}
.cd.done svg{width:80%;height:auto;margin-top:6px}
.cd.done em{font-style:normal;font-weight:700;font-size:.72rem;color:#8A5A00;margin-top:8px}
.cd.now{cursor:pointer;border:3px solid #F2C14E;background:#FFE9A8;color:#5B3A00}
.cd.now span{font-size:1.4rem;line-height:1}
.cd.now em{font-style:normal;font-weight:700;font-size:.62rem}
@media (prefers-reduced-motion:no-preference){.cd.now{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.doorwrap{position:relative;width:200px;height:260px;perspective:700px;margin:6px 0}
.prize{position:absolute;inset:0;display:grid;place-items:center;background:#FFF4CC;border-radius:14px;border:6px solid #8B4A1E}
.prize svg{width:170px;height:auto}
.bigcoin{font-size:6rem}
.doorp{position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,#E8505B,#B5179E);border:6px solid #8B4A1E;transform-origin:left center;
  transition:transform 1s cubic-bezier(.5,0,.3,1);display:grid;place-items:center;font-size:3rem;box-shadow:inset 0 0 0 10px rgba(255,255,255,.15)}
.doorwrap.open .doorp{transform:rotateY(-105deg)}
.own-sq{background:none;border:0;padding:0;cursor:pointer;border-radius:14px}
.coll.selling .own-sq{outline:3px dashed #E8505B;outline-offset:-2px;background:#FFE6EA}
.sellbtn{margin-top:10px;font-size:1rem;padding:8px 16px}
.sq svg{cursor:pointer}
.squeeze,.squeeze svg{animation:squish .45s ease-out}
@keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.25,.7)}55%{transform:scale(.9,1.15)}80%{transform:scale(1.05,.95)}100%{transform:scale(1,1)}}
.sq.myst{border:3px dashed}
.treasure .sellpic svg{width:150px;height:auto}
.who{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;
  background:var(--tile);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 14px}
.who span{font-weight:400;color:var(--soft);font-size:.9rem}
.plist{display:grid;gap:10px;margin:14px 0}
.pl{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;cursor:pointer;background:var(--tile);color:var(--ink);border:3px solid transparent;border-radius:16px;padding:8px 12px}
.pl.cur{border-color:#F2C14E}
.pl svg{width:56px;height:56px;flex:none}
.pl b{display:block;font-size:1.2rem}.pl small{color:var(--soft)}
.pl em{margin-left:auto;font-style:normal;font-weight:700;color:#B07800;font-size:.85rem}
.backtop{position:sticky;top:6px;z-index:5;margin-top:10px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;
  background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:9px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.coinpop{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:2rem;color:#FFD54A;margin:0}
h1{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:2.4rem;line-height:1.05;margin:18px 0 6px}
h2{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.5rem;margin:30px 0 10px;display:flex;align-items:center;gap:10px}
h2 .dot{width:14px;height:14px;border-radius:50%}
p.lead{color:var(--soft);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;
  background:var(--tile);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:12px 14px;font:inherit}
.tile:hover{border-color:currentColor}
.tile .ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.4rem;color:#fff}
.tile.math .ico{background:var(--math)} .tile.fr .ico{background:var(--fr)} .tile.sem .ico{background:#E8730C;font-size:1.15rem}
.tile b{display:block;line-height:1.2}
.tile small{color:var(--soft);font-size:.82rem;display:block;line-height:1.3}
.tile .best{color:var(--star);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.link{background:none;border:0;color:var(--soft);font:inherit;font-size:.95rem;text-decoration:underline;cursor:pointer;padding:6px 0;margin-top:28px}
/* Quiz */
.top{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.tag{font-weight:700;color:#fff;border-radius:999px;padding:2px 12px;font-size:.9rem}
.tag.math{background:var(--math)} .tag.fr{background:var(--fr)} .tag.sem{background:#E8730C}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.now{outline:2px solid var(--ink)}
.q{font-size:1.65rem;line-height:1.4;margin:30px 0 22px;min-height:3em}
.q.big{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:2.6rem}
.q .hint{color:var(--soft);font-size:.7em}
.q .inst{display:block;font-size:1rem;color:var(--soft);font-family:'Andika',system-ui,sans-serif;font-weight:400}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);text-align:center;color:var(--ok);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.opt{font:inherit;font-size:1.45rem;font-weight:700;padding:14px 10px;border-radius:16px;cursor:pointer;
  background:var(--paper);color:var(--ink);border:3px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1 1 180px;min-width:0;font:inherit;font-size:1.8rem;font-weight:700;padding:10px 14px;border-radius:14px;
  border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:1.15rem;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.alt{background:transparent;color:var(--ink);border:3px solid var(--ink)}
.speak{font:inherit;font-size:1.3rem;font-weight:700;border:3px solid var(--fr);color:var(--fr);background:var(--paper);border-radius:16px;padding:14px 22px;cursor:pointer}
.fb{margin-top:20px;font-size:1.25rem;min-height:2em}
.fb.ok{color:var(--ok);font-weight:700} .fb.bad{color:var(--bad)}
.fb.bad b{color:var(--ink)}
.next{margin-top:14px}
/* Fin */
.end{text-align:left;margin-top:30px}
.end .score{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:4.5rem;line-height:1}
.end .row{font-size:2rem;letter-spacing:4px;margin:10px 0 16px;color:var(--star)}
.end .row span{color:var(--line)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
/* Parents */
label{display:block;font-weight:700;margin:22px 0 6px}
.field{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
textarea.field{min-height:180px;resize:vertical}
.note{color:var(--soft);font-size:.9rem;margin:6px 0 0}
@media (max-width:480px){
  body::before{left:16px}
  .wrap{padding:0 14px 40px 30px}
  h1{font-size:2rem}
  .q{font-size:1.4rem} .q.big{font-size:2.2rem}
}
/* Ballons */
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}
.balloon{position:absolute;bottom:-120px;width:52px;height:64px;border-radius:50% 50% 48% 52%/58% 58% 42% 42%;
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);animation:rise var(--dur) ease-in var(--del) forwards}
.balloon::before{content:"";position:absolute;top:12px;left:12px;width:10px;height:16px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(25deg)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:60px;background:var(--soft);opacity:.6;transform:translateX(-50%)}
.balloon i{position:absolute;left:50%;top:calc(100% - 3px);transform:translateX(-50%);border:6px solid transparent;border-bottom-color:inherit;border-top:0;width:0;height:0}
@keyframes rise{0%{transform:translate(0,0) rotate(-4deg)}25%{transform:translate(var(--sw),-30vh) rotate(4deg)}
  50%{transform:translate(calc(var(--sw)*-1),-60vh) rotate(-4deg)}100%{transform:translate(var(--sw),-125vh) rotate(4deg)}}
/* Trésor */
.treasure{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(10,16,40,.82);color:#fff;text-align:center;padding:20px;cursor:pointer}
.treasure h3{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:2.3rem;line-height:1.1;margin:0;color:#FFD54A}
.treasure p{margin:0;font-size:1.15rem;opacity:.9}
.treasure svg{width:min(340px,86vw);height:auto;overflow:visible}
.lid{transform-origin:40px 128px;transform-box:view-box;animation:lid .7s cubic-bezier(.3,1.6,.5,1) .5s both}
@keyframes lid{from{transform:rotate(0)}to{transform:rotate(-38deg)}}
.gem{opacity:0;transform-box:fill-box;transform-origin:center;animation:gem .8s cubic-bezier(.2,1.5,.5,1) var(--d) both}
@keyframes gem{0%{opacity:0;transform:translate(0,60px) scale(.2)}100%{opacity:1;transform:translate(0,0) scale(1)}}
.glow{opacity:0;animation:glow 1.2s ease-out .9s both}
@keyframes glow{to{opacity:1}}
.spark{transform-box:fill-box;transform-origin:center;animation:twink 1.4s ease-in-out var(--d) infinite both}
@keyframes twink{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.lid{animation-duration:.01s}.gem{animation:none;opacity:1}.spark{animation:none;opacity:.8}.glow{animation:none;opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="brand" id="home">Mon cahier<br>de pratique</button>
    <div class="hdr-r"><button class="snd" id="snd" type="button"></button><div class="stars" id="stars" aria-label="Étoiles gagnées">★ 0</div><button class="gold" id="gold" type="button" aria-label="Pièces d'or, aller à la boutique">🪙 0</button></div>
  </header>
  <main id="app"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const BL='<span class="blank">___</span>';

/* ---------- Sauvegarde ---------- */
const KEY='cahier3:v1',PKEY='cahier3:profils',NOM_DEFAUT='Joueur 1';
const DEF=()=>({name:'',stars:0,best:{},words:null,sound:true,gold:0,owned:[],chests:{},earned:0,cal:{},mb:[]});
let S=DEF(),P={cur:null,list:[],data:{}};
const newId=()=>'j'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function wrapOld(o){const id=newId(),st=Object.assign(DEF(),o);return {cur:id,list:[id],data:{[id]:st}}}
function useProfile(id){P.cur=id;S=Object.assign(DEF(),P.data[id]||{});P.data[id]=S}
function load(){try{const v=localStorage.getItem(PKEY);if(v){const o=JSON.parse(v);if(o&&o.list&&o.list.length)P=o}
    else{const old=localStorage.getItem(KEY);if(old)P=wrapOld(JSON.parse(old))}}catch(e){}
  if(!P.list.length){const id=newId();P={cur:id,list:[id],data:{[id]:Object.assign(DEF(),{name:NOM_DEFAUT})}}}
  if(!P.data[P.cur])P.cur=P.list[0];useProfile(P.cur)}

/* ---------- Voix ---------- */
const canSpeak='speechSynthesis' in window;
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  const vs=speechSynthesis.getVoices();const v=vs.find(x=>/fr[-_]CA/i.test(x.lang))||vs.find(x=>/^fr/i.test(x.lang));
  if(v)u.voice=v;u.lang=v?v.lang:'fr-CA';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
if(canSpeak)speechSynthesis.getVoices();

/* ---------- Sons ---------- */
let AC=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}
  if(AC.state==='suspended')AC.resume();return AC}
function note(f,t0,d,type='triangle',vol=.22){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=f;const t=c.currentTime+t0;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}
function sfx(kind){if(!S.sound)return;try{
  if(kind==='ok'){note(784,0,.18);note(988,.09,.18);note(1319,.18,.35);note(2637,.2,.25,'sine',.06)}
  else if(kind==='bad')wahwah();
  else if(kind==='win'){[523,659,784,1047,784,1047,1319].forEach((f,i)=>note(f,i*.11,.22));
    [2093,2637,3136,2637,3520].forEach((f,i)=>note(f,.9+i*.13,.3,'sine',.07))}
  else if(kind==='end'){[523,659,784,1047].forEach((f,i)=>note(f,i*.12,.25));note(1319,.5,.6);note(1047,.5,.6,'sine',.12)}
}catch(e){}}
/* « Wah wah wah waaah » de trombone triste */
function wahwah(){const c=ac();if(!c)return;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.Q.value=4;
  const g=c.createGain();g.gain.value=0;f.connect(g).connect(c.destination);
  const o=c.createOscillator();o.type='sawtooth';o.connect(f);const t=c.currentTime;
  const seq=[[392,0,.28],[370,.32,.28],[349,.64,.28],[330,.96,.9]];
  seq.forEach(([fr,s,d],k)=>{o.frequency.setValueAtTime(fr,t+s);
    g.gain.setValueAtTime(0,t+s);g.gain.linearRampToValueAtTime(.13,t+s+.04);
    f.frequency.setValueAtTime(400,t+s);f.frequency.linearRampToValueAtTime(1200,t+s+.12);
    if(k<3){g.gain.linearRampToValueAtTime(0,t+s+d)}
    else{o.frequency.linearRampToValueAtTime(fr-18,t+s+d);g.gain.setValueAtTime(.13,t+s+d-.3);g.gain.linearRampToValueAtTime(0,t+s+d)}});
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=6;lg.gain.value=0;
  lg.gain.setValueAtTime(0,t+1.1);lg.gain.linearRampToValueAtTime(7,t+1.3);lfo.connect(lg).connect(o.frequency);
  o.start(t);lfo.start(t);o.stop(t+2);lfo.stop(t+2)}

/* ---------- Sons de squishies ---------- */
function noiseBuf(c,d){const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;return b}
function fart(){const c=ac();if(!c)return;const t=c.currentTime,d=rnd(45,95)/100,f0=rnd(70,115);
  const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0*1.3,t);o.frequency.exponentialRampToValueAtTime(f0*.7,t+d);
  const l=c.createOscillator(),lg=c.createGain();l.frequency.value=rnd(18,32);lg.gain.value=f0*.35;l.connect(lg).connect(o.frequency);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.Q.value=6;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.03);g.gain.setValueAtTime(.28,t+d*.7);g.gain.exponentialRampToValueAtTime(.001,t+d);
  const n=c.createBufferSource();n.buffer=noiseBuf(c,d);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=180;bp.Q.value=1.5;const ng=c.createGain();ng.gain.value=.35;
  o.connect(lp);n.connect(bp).connect(ng).connect(lp);lp.connect(g).connect(c.destination);o.start(t);l.start(t);n.start(t);o.stop(t+d+.05);l.stop(t+d+.05);n.stop(t+d+.05)}
function crinkle(){const c=ac();if(!c)return;const t=c.currentTime,d=.6;
  const n=c.createBufferSource();n.buffer=noiseBuf(c,d);const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500;
  const g=c.createGain();g.gain.setValueAtTime(0,t);
  for(let k=0;k<28;k++){const tt=t+Math.random()*d*.9;g.gain.setValueAtTime(rnd(10,35)/100,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.018)}
  n.connect(hp).connect(g).connect(c.destination);n.start(t);n.stop(t+d)}
function boing(){note(rnd(330,420),0,.12,'sine',.12);note(rnd(520,640),.05,.12,'sine',.08)}

function card(s){const own=S.owned.includes(s.id),cls=[own?'own':'',s.r?'rare r-'+s.r:'',s.g?'giant':''].join(' ');

const BOX=[
{id:'caillou',n:'Mystère caillou',p:15,col:'#9A9A94',f:x=>x.t==='roche'},

{id:'miam',n:'Mystère miam miam',p:40,col:'#FF9E40',f:x=>x.grp==='miam'},
{id:'doux',n:'Mystère tout doux',p:50,col:'#FF8FB8',f:x=>(x.f==='butter'||x.f==='pois')&&!x.m},
{id:'son',n:'Mystère sonore',p:90,col:'#7ED37A',f:x=>x.grp==='son'},
{id:'brille',n:'Mystère qui brille',p:200,col:'#FFD54A',f:x=>!x.g&&!x.m&&(x.f==='glit'||x.f==='holo'||x.r)}];
const boxPool=bx=>SQ.filter(x=>bx.f(x)&&!S.owned.includes(x.id)&&!(S.mb||[]).some(e=>e.s===x.id));

function shop(){

  ${sec('🎵 Squishies sonores','Pèse dessus : prout ou crrrac! Touche-les pour essayer.',SQ.filter(s=>s.grp==='son'))}

/* ---------- Calendrier ---------- */
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function calendar(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),today=now.getDate();
  const first=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();S.cal=S.cal||{};
  let cells='';for(let k=0;k<first;k++)cells+='<span class="cd empty"></span>';
  for(let d=1;d<=nd;d++){const r=S.cal[dkey(new Date(y,m,d))];
    if(r){const sq=r.s&&SQ.find(x=>x.id===r.s);cells+=`<span class="cd done"><i>${d}</i>${sq?squish(sq):`<em>🪙${r.g}</em>`}</span>`}
    else if(d===today)cells+=`<button class="cd now" id="today"><i>${d}</i><span>🚪</span><em>Ouvre!</em></button>`;
    else if(d<today)cells+=`<span class="cd miss"><i>${d}</i></span>`;
    else cells+=`<span class="cd lock"><i>${d}</i><span>🚪</span></span>`}
  return `<h2>📅 Mon calendrier</h2><p class="lead">Chaque jour, une nouvelle porte à ouvrir : des pièces d’or ou un squishie!</p>
  <div class="cal"><div class="calhead">${MOIS[m]} ${y}</div><div class="calgrid">${['L','M','M','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${cells}</div></div>`}
function openDoor(){const k=dkey(new Date());S.cal=S.cal||{};if(S.cal[k])return;
  const pool=SQ.filter(x=>!x.r&&!x.g&&!x.m&&!S.owned.includes(x.id));let r;
  if(pool.length&&Math.random()<.3){const sq=pick(pool);S.owned.push(sq.id);r={s:sq.id}}else{const g=rnd(10,15);S.gold+=g;S.earned=(S.earned||0)+g;r={g}}
  S.cal[k]=r;save();updStars();const sq=r.s&&SQ.find(x=>x.id===r.s);
  const ov=document.createElement('div');ov.className='treasure';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Porte du jour');
  ov.innerHTML=`<h3>Porte du ${new Date().getDate()} ${MOIS[new Date().getMonth()]}</h3>
  <div class="doorwrap"><div class="prize">${sq?squish(sq):'<span class="bigcoin">🪙</span>'}</div><div class="doorp"><span>🎀</span></div></div>
  <p class="coinpop" id="dw" style="opacity:0">${sq?esc(sq.n)+'!':'+'+r.g+' pièces d’or'}</p><p style="font-size:.95rem;opacity:.7">Touche pour continuer</p>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ov.querySelector('.doorwrap').classList.add('open');sfx('win')},350);
  setTimeout(()=>{ov.querySelector('#dw').style.opacity=1;balloons(12)},1100);
  ov.onclick=()=>{ov.remove();home()}}

/* ---------- Vendre ---------- */
const prixVente=s=>s.p>0?Math.max(5,Math.floor(s.p/2)):25;
function sell(id){const s=SQ.find(x=>x.id===id);if(!s||!S.owned.includes(id))return;const v=prixVente(s);
  const ov=document.createElement('div');ov.className='treasure';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Vendre');ov.style.cursor='default';
  ov.innerHTML=`<h3>Vendre ${esc(s.n)}?</h3><div class="sellpic">${squish(s)}</div><p style="font-size:1.3rem">Tu recevras <b style="color:#FFD54A">🪙 ${v}</b> pièces d’or.</p>

  <div class="actions" style="justify-content:center"><button class="btn" id="sy" style="background:#F2C14E;color:#4A3000">Vendre pour 🪙 ${v}</button><button class="btn alt" id="sn" style="color:#fff;border-color:#fff">Je le garde</button></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#sn').onclick=()=>ov.remove();
  ov.querySelector('#sy').onclick=()=>{S.owned=S.owned.filter(x=>x!==id);S.gold+=v;save();updStars();sfx('ok');ov.remove();const y=window.scrollY;shop();window.scrollTo(0,y)}}

function openMyst(i){S.mb=S.mb||[];const e=S.mb[i];if(!e)return;const s=SQ.find(x=>x.id===e.s);
  S.mb.splice(i,1);if(s&&!S.owned.includes(s.id))S.owned.push(s.id);save();updStars();
  const ov=document.createElement('div');ov.className='treasure';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Squishie mystère');
  ov.innerHTML=`<h3 id="mt">Mystère…</h3><div class="mreveal">${squish(s)}</div><p id="mn" style="font-size:1.5rem;font-weight:700;min-height:1.6em"></p><p style="font-size:.95rem;opacity:.7">Touche le squishie!</p>`;
  document.body.appendChild(ov);
  let done=false;ov.onclick=()=>{if(!done){done=true;const m=ov.querySelector('.mreveal');m.classList.add('go');
      setTimeout(()=>{ov.querySelector('#mt').textContent=s.m?'Exclusif mystère!':'Wow!';ov.querySelector('#mn').textContent=s.n;sfx('win');balloons(14);if(s.snd&&S.sound)setTimeout(()=>s.snd==='pet'?fart():crinkle(),900)},900);
      ov.querySelector('p:last-child').textContent='Touche pour continuer';return}
    ov.remove();shop()};
}

function home(){
  if(canSpeak)speechSynthesis.cancel();
  const tiles=m=>ACT.filter(a=>a.m===m).map(a=>`<button class="tile ${m}" data-id="${a.id}"><span class="ico">${a.i}</span>
    <span><b>${a.t}</b><small>${a.d}</small>${S.best[a.id]!=null?`<small class="best">Meilleur : ${S.best[a.id]}/10</small>`:''}</span></button>`).join('');
  app.innerHTML=`<button class="who" id="who">👤 ${esc(S.name||'Joueur')} <span>· changer de joueur</span></button><h1>Salut${S.name?' '+esc(S.name):''}!</h1>
  <p class="lead">Choisis une activité. Chaque bonne réponse te donne une étoile et une pièce d’or.</p>
  <h2><span class="dot" style="background:#E8730C"></span>Semaine 28 sept au 9 oct</h2><p class="lead" style="margin-top:-4px">Les devoirs de la semaine, tirés de ses feuilles.</p><div class="grid">${tiles('sem')}</div>
  <h2><span class="dot" style="background:var(--math)"></span>Mathématiques</h2><div class="grid">${tiles('math')}</div>
  <h2><span class="dot" style="background:var(--fr)"></span>Français</h2><div class="grid">${tiles('fr')}</div>
  <button class="shopbtn" id="shopbtn">${squish(SQ[0])}<span><b>Boutique de squishies</b>Échange tes pièces d’or · tu as 🪙 ${S.gold}</span></button>
  <button class="shopbtn dashbtn" id="dashbtn">${chestSvg('mul2')}<span><b>Mon tableau de bord</b>Mes coffres, mes squishies et mes records</span></button>
  ${calendar()}
  <button class="link" id="par">Coin des parents</button>`;
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>start(b.dataset.id));
  const td=$('#today');if(td)td.onclick=openDoor;
  $('#who').onclick=players;$('#dashbtn').onclick=dash;$('#shopbtn').onclick=shop;$('#par').onclick=parents;window.scrollTo(0,0);
}

let R=null;
function start(id){const act=ACT.find(a=>a.id===id),qs=[],seen=new Set();let n=0;
  while(qs.length<10&&n<300){n++;const q=act.g(),k=q.q+'|'+q.ans;if(seen.has(k))continue;seen.add(k);qs.push(q)}
  R={act,qs,i:0,score:0,res:[]};showQ()}

function showQ(){const{act,qs,i}=R,q=qs[i];
  const dots=qs.map((_,j)=>`<i class="${R.res[j]===true?'ok':R.res[j]===false?'bad':j===i?'now':''}"></i>`).join('');
  let body='';
  if(q.kind==='choice'){const o=q.keep?q.opts:q.opts;
    body=`<div class="opts">${o.map(x=>`<button class="opt" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}
  else{const num=q.kind==='num';
    body=`<form class="answer" id="f" autocomplete="off"><input id="in" ${num?'inputmode="numeric" pattern="[0-9]*"':'autocapitalize="off" spellcheck="false"'} aria-label="Ta réponse" placeholder="${num?'?':'Écris le mot'}">
    <button class="btn" type="submit">Vérifier</button></form>`}
  const qtxt=q.kind==='text'
    ?`<button class="speak" id="sp" type="button">🔊 Écouter le mot</button>${canSpeak?'':`<p class="note">La lecture à voix haute ne marche pas sur cet appareil. Un parent peut lire le mot : <button class="link" id="show" type="button" style="margin:0">montrer le mot</button></p>`}`
    :q.q;
  app.innerHTML=`<div class="top"><span class="tag ${act.m}">${act.t}</span><div class="dots" aria-label="Question ${i+1} sur 10">${dots}</div></div>
  <div class="q ${q.big?'big':''}">${qtxt}</div>${body}<div class="fb" id="fb" aria-live="polite"></div><div id="nx"></div>`;
  if(q.kind==='choice')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>check(b.dataset.v,b));
  else{const inp=$('#in');$('#f').onsubmit=e=>{e.preventDefault();if(inp.value.trim()!=='')check(inp.value)};inp.focus()}
  if(q.kind==='text'){$('#sp').onclick=()=>{speak(q.speak);$('#in').focus()};speak(q.speak);
    const sh=$('#show');if(sh)sh.onclick=()=>{sh.outerHTML='<b>'+esc(q.speak)+'</b>'}}
}

const norm=s=>String(s).replace(/[’`]/g,"'").trim().toLowerCase().replace(/\s+/g,' ');
const bare=s=>norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const BRAVO=["Bravo!","Super!","Excellent!","Bien joué!","Parfait!","Wow!"];

function check(v,btn){const q=R.qs[R.i];let ok;
  if(q.kind==='num')ok=Number(String(v).replace(/\s/g,''))===q.ans;
  else if(q.kind==='text')ok=norm(v)===norm(q.ans);
  else ok=v===q.ans;
  R.res[R.i]=ok;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.ans)b.classList.add('ok')});
  if(btn&&!ok)btn.classList.add('bad');
  const inp=$('#in');if(inp){inp.disabled=true;$('#f button').disabled=true;inp.style.borderColor=ok?'var(--ok)':'var(--bad)'}
  const fb=$('#fb');
  sfx(ok?'ok':'bad');if(ok)balloons();else poops();
  if(ok){R.score++;S.stars++;S.gold++;S.earned=(S.earned||0)+1;save();updStars();fb.className='fb ok';fb.innerHTML=`<span class="pop" style="display:inline-block">★</span> ${pick(BRAVO)} <span style="color:#B07800">+1 🪙</span>`;
    const bl=app.querySelector('.blank');if(bl)bl.textContent=q.ans}
  else{fb.className='fb bad';
    const presque=q.kind==='text'&&bare(v)===bare(q.ans);
    fb.innerHTML=(presque?'Presque! Attention aux accents. ':'Pas tout à fait. ')+`La bonne réponse : <b>${esc(q.ans)}</b>`}
  const last=R.i===R.qs.length-1;
  $('#nx').innerHTML=`<button class="btn next" id="go">${last?'Voir mon résultat':'Question suivante'}</button>`;
  const go=$('#go');go.onclick=()=>{if(last)end();else{R.i++;showQ()}};go.focus();
}

function end(){const{act,score}=R;let coins=0;
  if(score===10){coins=rnd(10,30);S.gold+=coins;S.earned=(S.earned||0)+coins;S.chests[act.id]=(S.chests[act.id]||0)+1;save();updStars();setTimeout(()=>treasure(act,coins),300)}else if(score>=5)sfx('end');const prev=S.best[act.id];if(prev==null||score>prev)S.best[act.id]=score;save();
  const msg=score===10?'Parfait, 10 sur 10!':score>=8?'Excellent travail!':score>=5?'Bon effort, continue!':'On recommence ensemble, tu vas t’améliorer!';
  app.innerHTML=`<div class="end"><span class="tag ${act.m}">${act.t}</span>
  <div class="score" style="margin-top:18px">${score}/10</div>
  <div class="row" aria-hidden="true">${'★'.repeat(score)}<span>${'★'.repeat(10-score)}</span></div>
  <p style="font-size:1.3rem;margin:0">${msg}</p>
  ${coins?`<p style="font-size:1.2rem;margin:8px 0 0;color:#B07800;font-weight:700">+${coins} pièces d’or 🪙</p>`:''}
  ${prev!=null&&score>prev?'<p class="note">Nouveau record!</p>':''}
  <div class="actions"><button class="btn" id="again">Rejouer</button><button class="btn alt" id="menu">Autre activité</button></div></div>`;
  $('#again').onclick=()=>start(act.id);$('#menu').onclick=home;$('#again').focus();
}

function parents(){
  app.innerHTML=`<button class="backtop" type="button">← Retour aux exercices</button><h1>Coin des parents</h1>
  <label for="nm">Prénom de l’enfant</label><input class="field" id="nm" value="${esc(S.name)}" maxlength="30">
  <label for="wd">Mots de dictée</label>
  <textarea class="field" id="wd">${esc(mots().join('\n'))}</textarea>
  <p class="note">Un mot par ligne (ou séparés par des virgules). Collez ici la liste de mots de la semaine envoyée par l’école. Ces mots servent aussi pour l’ordre alphabétique.</p>
  <div class="actions"><button class="btn" id="sv">Enregistrer</button><button class="btn alt" id="df">Remettre la liste de base</button></div>
  <p class="note" id="ok" aria-live="polite"></p>
  <label>Progrès</label><p class="note" style="margin-top:0">${S.stars} étoiles gagnées au total.</p>
  <button class="link" id="rz" style="margin-top:4px">Remettre les étoiles et les records à zéro</button>
  ${P.list.length>1?'<br><button class="link" id="delp" style="margin-top:4px;color:var(--bad)">Supprimer ce joueur</button>':''}
  <div class="actions"><button class="btn alt" id="bk">Retour au menu</button></div>`;
  $('#sv').onclick=()=>{S.name=$('#nm').value.trim();const w=uniq($('#wd').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean));
    S.words=w.length?w:null;save();$('#ok').textContent='Enregistré.'};
  $('#df').onclick=()=>{S.words=null;save();$('#wd').value=MOTS_DEFAUT.join('\n');$('#ok').textContent='Liste de base remise.'};
  const dl=$('#delp');if(dl)dl.onclick=()=>{if(P.list.length<2)return;if(confirm('Supprimer le joueur '+(S.name||'')+' et toute sa progression?')){const id=P.cur;P.list=P.list.filter(x=>x!==id);delete P.data[id];useProfile(P.list[0]);save();updStars();updSnd();home()}};
  $('#rz').onclick=()=>{if(confirm('Remettre toutes les étoiles et records à zéro?')){S.stars=0;S.best={};S.gold=0;S.owned=[];S.chests={};S.earned=0;S.cal={};S.myst=0;S.mb=[];save();updStars();parents()}};
  $('#bk').onclick=home;window.scrollTo(0,0);
}

$('#home').onclick=home;document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.backtop'))home()});$('#gold').onclick=shop;
$('#snd').onclick=()=>{S.sound=!S.sound;save();updSnd();if(S.sound)sfx('ok')};
document.addEventListener('pointerdown',()=>ac(),{once:true});
load();save();updStars();updSnd();home();cloudInit();
</script>
</body>
</html>
